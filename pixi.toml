[workspace]
channels = ["pytorch", "nvidia", "pyg", "dglteam/label/cu121", "conda-forge", "nodefaults"]
name = "gneprop"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.5.*"
pytorch = { version = "==2.0.1", build = "py3.11_cuda11.7*" }
pytorch-cuda = "11.7.*"
h5py = "==3.9.0"
pyg = "==2.4.0"
dgl = "==2.0.0.cu121"
pandas = "==2.2.2"
pip = "*"
mkl = "==2024.0.0"
mkl-devel = "==2024.0.0"
mkl-include = "==2024.0.0"
setuptools = "==69.5.1"
pyarrow = "<14"
pytorch-scatter = ">=2.1.2,<3"
pytorch-sparse = ">=0.6.18,<0.7"

[pypi-dependencies]
rdkit = "==2023.3.2"
dgllife = "==0.3.2"
torchdata = "==0.7.1"
pydantic = "==1.10.15"
torchsampler = "==0.1.2"
torchvision = "==0.15.2"
torcheval = "==0.0.7"
pytorch-lightning = "==1.9.5"
lightning-bolts = "==0.7.0"
captum = "==0.7.0"
wandb = "==0.16.4"
matplotlib = "==3.8.3"
omegaconf = "==2.3.0"
descriptastorus = { git = "https://github.com/bp-kelley/descriptastorus" }
umap-learn = "*"
seaborn = "*"
pyarrow = "*"
cython = "==3.0.11"
scikit-learn = "*"
openpyxl = "*"
pyyaml = "*"
ray = { version = "==2.9.3", extras = ["tune"] }
ax-platform = ">=0.3.6, <0.4"
pytdc = ">=0.4.1, <0.5"
transformers = ">=4.40, <4.50"
